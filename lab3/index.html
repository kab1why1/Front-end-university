<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Лабораторна робота №3, варіант 9: два способи блокової верстки макета сайту.">
  <title>ПІБ студента, група — ЛР №3, варіант 9</title>
  <style>
    * { 
      box-sizing: border-box; 
      }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      display: grid; 
      place-items: center; 
      padding: 28px; 
      color: #17212b; 
      background: #f4f7fa; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; 
    }

    main { 
      width: min(760px, 100%); 
    }

    .eyebrow { 
      color: #687789; 
      font-size: .75rem; 
      font-weight: 800; 
      letter-spacing: .14em; 
    }

    h1 { 
      margin: 8px 0; 
      font-size: clamp(2rem, 5vw, 3rem); 
      letter-spacing: -.04em; 
    }

    p { 
      color: #6b7280; 
      line-height: 1.6; 
    }

    .choices { 
      display: grid; 
      grid-template-columns: repeat(2, minmax(0,1fr)); 
      gap: 16px; 
      margin-top: 28px; 
    }

    a { 
      padding: 24px; 
      border-radius: 16px; 
      border: 1px solid #dce3ea; 
      color: #17212b; 
      background: white; 
      text-decoration: none; 
      box-shadow: 0 12px 28px rgba(25,42,60,.06); 
      transition: transform .15s ease, box-shadow .15s ease; 
    }

    a:hover, a:focus-visible { 
      transform: translateY(-3px); 
      box-shadow: 0 18px 36px rgba(25,42,60,.12); 
      outline: 2px solid #69d4e7; 
      outline-offset: 2px; 
    }
    
    a strong { 
      display: block; 
      margin-bottom: 8px; 
      color: #216847; 
      font-size: 1.15rem; 
    }

    a span { 
      color: #6b7280; 
      font-size: .92rem; 
    }

    footer { 
      margin-top: 25px; 
      color: #8792a0; 
      font-size: .82rem; 
    }
    @media (max-width: 540px) 
    { .choices { 
      grid-template-columns: 1fr; 
    } 
  }
  </style>
</head>
<body>
  <main>  
    <div class="choices">
      <a href="float-version/index.html"><strong>float</strong></a>
      <a href="flex-version/index.html"><strong>Flexbox</strong><span></a>
    </div>
  </main>
</body>
</html>
