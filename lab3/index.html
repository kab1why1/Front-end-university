<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Лабораторна робота №3, варіант 9: два способи блокової верстки макета сайту.">
  <title>ЛР №3, варіант 9</title>
  <style>
    * { 
      box-sizing: border-box; 
    }
    
    body { 
      margin: 0; 
      padding: 40px 20px; 
      background-color: #f9f9f9; 
      color: #333; 
      font-family: Arial, sans-serif; 
      display: flex;
      justify-content: center;
    }

    main { 
      width: 100%; 
      max-width: 600px; 
      background: #ffffff;
      padding: 30px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }

    h1 { 
      margin-top: 0;
      font-size: 24px; 
      color: #222;
    }

    p { 
      color: #555; 
      line-height: 1.5; 
      margin-bottom: 30px;
    }

    .choices { 
      display: flex; 
      gap: 15px; 
      justify-content: center;
    }

    a { 
      flex: 1;
      padding: 15px 20px; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      color: #333; 
      background-color: #f1f1f1; 
      text-decoration: none; 
      font-size: 18px;
      font-weight: bold;
      transition: background-color 0.2s ease; 
    }

    a:hover, a:focus-visible { 
      background-color: #e2e2e2; 
      outline: 2px solid #007bff;
      outline-offset: 2px;
    }

    @media (max-width: 480px) { 
      .choices { 
        flex-direction: column; 
      } 
    }
  </style>
</head>
<body>
  <main>
    <h1>Лабораторна робота №3</h1>
    <p>Варіант 9: два способи блокової верстки макета сайту.</p>
    
    <div class="choices">
      <a href="float-version/index.html">Верстка на Float</a>
      <a href="flex-version/index.html">Верстка на Flexbox</a>
    </div>
  </main>
</body>
</html>
