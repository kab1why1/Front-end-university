<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кияниця Іван Сергійович. ІС-43 - Лабораторна №5</title>
<style>
  * { 
    box-sizing: border-box; 
  }
  
  body {
    margin: 20px;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #000000;
    line-height: 1.5;
  }

  main { 
    max-width: 800px; 
    margin: 0 auto; 
  }

  section {
    border: 1px solid #000;
    padding: 15px;
    margin-bottom: 20px;
  }

  h2 { 
    margin-top: 0; 
  }

  .toolbar { 
    margin-bottom: 15px; 
  }

  input[type="text"] {
    padding: 5px;
    border: 1px solid #666;
  }

  button {
    padding: 5px 10px;
    border: 1px solid #000;
    background: #eee;
    color: #000;
    cursor: pointer;
  }

  button:hover {
    background: #ddd;
  }

  .actions { 
    margin-top: 15px; 
  }

  /* ---------- Завдання 1: форма ---------- */
  table { 
    border-collapse: collapse; 
  }
  
  .form-table td { 
    border: 1px solid #999; 
    padding: 5px; 
  }

  .form-table input { 
    width: 100%; 
  }

  .msg { 
    color: red; 
    font-size: 0.85rem; 
  }

  tr.error td { 
    background: #ffe6e6; 
  }

  #formStatus { 
    font-weight: bold; 
  }
  #formStatus.bad { color: red; }
  #formStatus.good { color: green; }

  dialog { 
    border: 2px solid #000; 
    padding: 20px; 
  }
  
  dialog::backdrop { 
    background: rgba(0, 0, 0, 0.5); 
  }
  
  dialog td { 
    border: 1px solid #999; 
    padding: 5px; 
  }

  /* ---------- Завдання 2: таблиця 6x6 ---------- */
  .palette { 
    display: inline-block; 
    margin-right: 15px; 
  }

  .swatches { 
    display: inline-flex; 
    gap: 5px; 
    vertical-align: middle;
  }

  .swatches button {
    width: 25px; 
    height: 25px; 
    padding: 0;
  }

  #grid { 
    margin: 15px 0; 
  }

  #grid td {
    width: 50px; 
    height: 50px;
    text-align: center;
    border: 1px solid #000;
  }

  #grid td.target { 
    font-weight: bold; 
    cursor: pointer; 
    background-color: #f0f0f0;
  }

  #gridInfo { 
    color: #555; 
  }
</style>
</head>
<body>
<main>
  <section id="task1">
    <h2>Завдання 1</h2>
    <form id="regForm" novalidate>
      <table class="form-table"><tbody id="formBody"></tbody></table>
      <div class="actions">
        <button type="submit">Перевірити</button>
        <button type="reset" class="secondary">Очистити</button>
      </div>
      <p id="formStatus" role="status"></p>
    </form>
  </section>

  <section id="task2">
    <h2>Завдання 2</h2>
    <div class="toolbar">
      <div class="palette">
        <label for="colorPicker">Палітра:</label>
        <input type="color" id="colorPicker" value="#3b6cf6">
        <div class="swatches" id="swatches"></div>
      </div>
      <button type="button" class="secondary" id="resetGrid">Скинути кольори</button>
    </div>

    <div class="grid-wrap"><table id="grid"></table></div>
    <p id="gridInfo"></p>
  </section>

</main>

<dialog id="resultDialog">
  <h3 style="margin-top:0">Введена інформація</h3>
  <div id="dialogContent"></div>
  <button type="button" id="closeDialog">Закрити</button>
</dialog>

<script src="./script.js"></script>
</body>
</html>
