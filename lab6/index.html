<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кияниця Іван Сергійович. ІС-43 - Лабораторна №6</title>
<style>
  * { 
    box-sizing: border-box; 
  }

  body {
    margin: 20px;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #000000;
    line-height: 1.5;
  }

  main { 
    max-width: 600px; 
    margin: 0 auto; 
  }

  .card {
    border: 1px solid #000;
    padding: 15px;
  }

  .photo { 
    display: block; 
    width: 150px; 
    height: 150px; 
    margin: 0 auto 15px; 
    background: #eee; 
    border: 1px solid #999;
    /* Фото буде квадратним, як класичне зображення */
  }

  table { 
    width: 100%; 
    border-collapse: collapse; 
  }

  td { 
    border: 1px solid #999; 
    padding: 5px; 
  }

  button {
    margin-top: 15px;
    padding: 5px 10px;
    border: 1px solid #000;
    background: #eee;
    color: #000;
    cursor: pointer;
  }

  button:hover {
    background: #ddd;
  }

  button:disabled { 
    color: #999;
    cursor: wait; 
  }

  #status { 
    margin-top: 15px; 
    color: #555; 
  }

  #status.error { 
    color: red; 
    font-weight: bold; 
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <img id="photo" class="photo" alt="Фото користувача">
    <table><tbody id="info"></tbody></table>
    <button type="button" id="reload">Завантажити іншого</button>
    <p id="status" role="status"></p>
  </div>
</main>

<script src="./script.js"></script>
</body>
</html>
